[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amdl"
version = "0.1.0"
description = "Apple Music downloader CLI and Telegram bot (Python port of abrinternet/apple-music-downloader)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx[socks]>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "pycryptodome>=3.20",
    "protobuf>=5.26",
    "mutagen>=1.47",
    "rich>=13.7",
    "tqdm>=4.66",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
apple-music-dl = "amdl.cli:main"
apple-music-tgbot = "amdltgbot.__main__:main"

[tool.setuptools.packages.find]
include = ["amdl*", "amdltgbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
