name: Dependabot dependency validation
run-name: 'Dependabot #${{ inputs.pr }} ${{ inputs.head }}'
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: string
        description: Dependabot PR number
      head:
        required: true
        type: string
        description: Expected PR head SHA
      base:
        required: true
        type: string
        description: Expected base SHA
permissions: {}
concurrency:
  group: dependabot-validation-${{ inputs.pr }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_POLICY || '{"linux":["ubuntu-24.04"],"x64":["ubuntu-24.04"],"hosted":true}').linux 
      }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      files: ${{ steps.pr.outputs.files }}
      android: ${{ steps.pr.outputs.android }}
      node: ${{ steps.pr.outputs.node }}
      go: ${{ steps.pr.outputs.go }}
    steps:
    - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      id: pr
      env:
        PR_NUMBER: ${{ inputs.pr }}
        EXPECTED_HEAD: ${{ inputs.head }}
        EXPECTED_BASE: ${{ inputs.base }}
      with:
        script: |-
          const number=Number(process.env.PR_NUMBER);
          if (!Number.isSafeInteger(number) || number<1) throw new Error('Invalid PR number');
          const {data:p}=await github.rest.pulls.get({...context.repo,pull_number:number});
          if (p.state!=='open' || p.draft || p.user.id!==49699333 || p.user.login!=='dependabot[bot]'
              || p.head.repo?.full_name!==context.payload.repository.full_name
              || p.base.ref!==context.payload.repository.default_branch) throw new Error('Untrusted PR');
          const {data:base}=await github.rest.git.getRef({...context.repo,ref:'heads/'+p.base.ref});
          if (p.head.sha!==process.env.EXPECTED_HEAD || base.object.sha!==process.env.EXPECTED_BASE)
            throw new Error('PR changed; requeue validation');
          const files=await github.paginate(github.rest.pulls.listFiles,{...context.repo,pull_number:number,per_page:100});
          core.setOutput('files',JSON.stringify(files.map(f=>f.filename)));
          core.setOutput('android',String(files.some(f=>f.filename.startsWith('apps/android/'))));
          core.setOutput('node',String(files.some(f=>/(package.json|lock.yaml|package-lock.json)$/.test(f.filename))));
          core.setOutput('go',String(files.some(f=>/go\.(mod|sum)$/.test(f.filename))));
  validate:
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.android == 'true' && fromJSON(vars.ACTIONS_RUNNER_POLICY || '{"x64":["ubuntu-24.04"]}').x64
      || fromJSON(vars.ACTIONS_RUNNER_POLICY || '{"linux":["ubuntu-24.04"]}').linux }}
    if: ${{ needs.prepare.outputs.android != 'true' || fromJSON(vars.ACTIONS_RUNNER_POLICY || '{"hosted":true}').hosted }}
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      CHANGED_FILES: ${{ needs.prepare.outputs.files }}
      CI: 'true'
      OPENCLAW_TEST_PROFILE: serial
      OPENCLAW_TEST_SERIAL_GATEWAY: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.base }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.head }}
        fetch-depth: 0
        persist-credentials: false
    - name: Combine exact PR and base commits
      env:
        EXPECTED_BASE: ${{ inputs.base }}
      run: git -c user.name=dependency-validation -c user.email=validation@localhost merge --no-commit --no-ff "$EXPECTED_BASE"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.14'
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      if: needs.prepare.outputs.node == 'true'
      with:
        node-version: '24'
    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
      if: needs.prepare.outputs.android == 'true'
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      if: needs.prepare.outputs.go == 'true'
      with:
        go-version: stable
        cache: false
    - name: Install actionlint
      run: |-
        python -m pip install actionlint-py==1.7.12.24
    - name: Install Node package manager
      if: needs.prepare.outputs.node == 'true'
      run: npm install --global corepack
    - name: Validate dependency changes
      shell: python
      run: |
        """Run dependency-specific checks in an unprivileged CI job, without publishing."""
        import json, os, re, subprocess
        from pathlib import Path

        def run(*args, cwd=None):
            print('+', ' '.join(args), flush=True)
            subprocess.run(args, cwd=cwd, check=True)

        def main():
            files=json.loads(os.environ['CHANGED_FILES'])
            supported=[]
            workflows=[f for f in files if f.startswith('.github/workflows/') and f.endswith(('.yml','.yaml'))]
            if workflows:
                run('actionlint','-shellcheck=','-pyflakes=',*workflows)
                supported+=workflows
            dockerfiles=[f for f in files if 'Dockerfile' in Path(f).name]
            for file in dockerfiles:
                run('docker','build','--check','-f',file,'.')
                # Resolve all literal pinned base images, including changed image digests.
                for line in Path(file).read_text().splitlines():
                    m=re.match(r'FROM\s+([^\s]+)',line,re.I)
                    if m and '@sha256:' in m[1] and '$' not in m[1]:
                        run('docker','buildx','imagetools','inspect',m[1])
                supported.append(file)
            go_dirs=sorted({str(Path(f).parent) for f in files if Path(f).name in ['go.mod','go.sum']})
            for directory in go_dirs:
                run('go','mod','download',cwd=directory)
                run('go','test','./...',cwd=directory)
                supported += [f for f in files if str(Path(f).parent)==directory and Path(f).name in ['go.mod','go.sum']]
            android=[f for f in files if f.startswith('apps/android/')]
            if android:
                run('bash','./gradlew','testPlayDebugUnitTest','testThirdPartyDebugUnitTest','--no-daemon','--console=plain',cwd='apps/android')
                supported+=android
            python=[f for f in files if re.search(r'(^|/)(requirements[^/]*\.txt|pyproject\.toml|poetry\.lock|uv\.lock|Pipfile(?:\.lock)?)$',f)]
            if python:
                run('python','-m','venv','.dependabot-venv')
                py=str(Path('.dependabot-venv/bin/python').resolve())
                if Path('requirements.txt').exists():run(py,'-m','pip','install','-r','requirements.txt')
                if Path('requirements-dev.txt').exists():run(py,'-m','pip','install','-r','requirements-dev.txt')
                if not Path('requirements.txt').exists():run(py,'-m','pip','install','-e','.')
                run(py,'-m','pip','check')
                run(py,'-m','pip','install','pytest','pytest-asyncio','PyYAML')
                if Path('tests').exists():run(py,'-m','pytest','-q','tests')
                elif Path('test_utils.py').exists():run(py,'-m','unittest','-v','test_utils')
                else:
                    sources=[str(p) for p in Path('.').glob('*.py')]
                    if sources:run(py,'-m','py_compile',*sources)
                supported+=python
            node=[f for f in files if Path(f).name in ['package.json','package-lock.json','pnpm-lock.yaml','yarn.lock','bun.lock','bun.lockb']]
            if node:
                package=json.loads(Path('package.json').read_text())
                if Path('pnpm-lock.yaml').exists():
                    run('corepack','enable')
                    run('pnpm','install','--frozen-lockfile')
                    for script in ['check','test','build']:
                        if script in package.get('scripts',{}):run('pnpm',script)
                else:
                    run('npm','ci' if Path('package-lock.json').exists() else 'install','--no-audit','--no-fund')
                    for script in ['test','build']:
                        if script in package.get('scripts',{}):run('npm','run',script)
                supported+=node
            unknown=set(files)-set(supported)
            if unknown:raise RuntimeError('No validated dependency recipe for: '+', '.join(sorted(unknown)))
            if not files:raise RuntimeError('Empty dependency update')

        if __name__=='__main__':main()
  result:
    needs:
    - prepare
    - validate
    if: ${{ always() }}
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_POLICY || '{"linux":["ubuntu-24.04"],"x64":["ubuntu-24.04"],"hosted":true}').linux 
      }}
    timeout-minutes: 3
    permissions: {}
    steps:
    - env:
        RESULT: ${{ needs.validate.result }}
      run: test "$RESULT" = success
