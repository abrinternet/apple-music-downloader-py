name: Python acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run acceptance and regression tests
        run: python -m pytest -q
