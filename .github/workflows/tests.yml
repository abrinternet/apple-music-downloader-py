name: Python acceptance
on:
  workflow_dispatch:
  schedule:
    - cron: 41 3 * * 1
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_POLICY || 
      '{"linux":["ubuntu-24.04"],"arm64":["ubuntu-24.04-arm"],"x64":["ubuntu-24.04"],"hosted":true}').linux }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run acceptance and regression tests
        run: python -m pytest -q
